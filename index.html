<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Tracker - Gestion des vols</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Importation du client JavaScript Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <!-- En-tête -->
        <header class="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700 gap-4">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-blue-400">✈️ Flight Price Tracker</h1>
                <p class="text-slate-400 text-sm">Gérez vos vols et synchronisez les prix en direct via Supabase & Skyscanner.</p>
            </div>
            <div class="flex flex-wrap gap-3">
                <input type="text" id="scriptUrl" placeholder="URL Web App Google Script (/exec)" class="bg-slate-900 border border-slate-700 text-xs px-3 py-2 rounded-lg w-64 text-slate-300 focus:outline-none focus:border-blue-500">
                <button onclick="lancerScanAPI()" id="btnScan" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition shadow">Lancer le scan API</button>
            </div>
        </header>

        <!-- Formulaire Ajout / Édition -->
        <section class="bg-slate-800 p-6 rounded-2xl shadow-lg border border-slate-700">
            <h2 id="formTitle" class="text-lg font-semibold mb-4 text-slate-200">Ajouter un nouveau vol à suivre</h2>
            <form id="volForm" onsubmit="enregistrerVol(event)" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4">
                <input type="hidden" id="editId" value="-1">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Statut</label>
                    <select id="statut" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                        <option value="ACTIF">ACTIF</option>
                        <option value="INACTIF">INACTIF</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Départ (IATA)</label>
                    <input type="text" id="depart" placeholder="ex: MRS" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm uppercase text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Arrivée (IATA)</label>
                    <input type="text" id="arrivee" placeholder="ex: NTE" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm uppercase text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Date Aller</label>
                    <input type="date" id="dateAller" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Date Retour (Optionnel)</label>
                    <input type="date" id="dateRetour" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Compagnie (Optionnel)</label>
                    <input type="text" id="compagnie" placeholder="ex: Ryanair" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Escales max</label>
                    <input type="text" id="escales" value="0" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200">
                </div>
                <div class="flex items-end gap-2">
                    <button type="submit" id="btnSubmit" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-medium p-2 rounded-lg text-sm transition">Ajouter</button>
                    <button type="button" onclick="resetForm()" class="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-lg text-sm transition">Annuler</button>
                </div>
            </form>
        </section>

        <!-- Tableau des vols -->
        <section class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center">
                <h3 class="font-semibold text-slate-200">Vols configurés (Supabase)</h3>
                <span id="compteurVols" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full">0 vol(s)</span>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse text-sm">
                    <thead>
                        <tr class="bg-slate-900 text-slate-400 uppercase text-xs">
                            <th class="p-3">Statut</th>
                            <th class="p-3">Trajet</th>
                            <th class="p-3">Dates</th>
                            <th class="p-3">Compagnie / Escales</th>
                            <th class="p-3">Prix Actuel</th>
                            <th class="p-3">Min / Précédent</th>
                            <th class="p-3">Dernier Scan</th>
                            <th class="p-3 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="volsTableBody" class="divide-y divide-slate-700 text-slate-300">
                        <!-- Rempli dynamiquement -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <script>
        // --- CONFIGURATION SUPABASE ---
        const SUPABASE_URL = "https://xgqyifrbhcnhxrtnxnjf.supabase.co";       // Remplacez par votre URL Supabase
        const SUPABASE_ANON_KEY = "sb_publishable_Wy_HcBbudLuGkZZ4FZHYPg_SA2i4457"; // Remplacez par votre clé Anon Supabase
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let vols = [];

        // Gestion de l'URL Google Apps Script en mémoire locale
        document.getElementById("scriptUrl").value = localStorage.getItem("skyscanner_webapp_url") || "";
        document.getElementById("scriptUrl").addEventListener("input", (e) => {
            localStorage.setItem("skyscanner_webapp_url", e.target.value.trim());
        });

        // Charger les données au démarrage depuis Supabase
        document.addEventListener("DOMContentLoaded", chargerVolsDepuisSupabase);

        async function chargerVolsDepuisSupabase() {
            const { data, error } = await _supabase
                .from('vols')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Erreur de chargement Supabase:", error);
                alert("Impossible de charger les données depuis Supabase.");
                return;
            }

            vols = data || [];
            afficherVols();
        }

        function afficherVols() {
            const tbody = document.getElementById("volsTableBody");
            tbody.innerHTML = "";
            document.getElementById("compteurVols").textContent = `${vols.length} vol(s)`;

            if (vols.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8" class="text-center p-6 text-slate-500">Aucun vol enregistré dans la base.</td></tr>`;
                return;
            }

            vols.forEach((vol) => {
                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-750 transition";
                
                let lienHtml = vol.lien ? `<a href="${vol.lien}" target="_blank" class="text-blue-400 hover:underline ml-1">🔗 Lien</a>` : "";
                let statutBadge = vol.statut === "ACTIF" ? '<span class="bg-emerald-900 text-emerald-300 text-xs px-2 py-0.5 rounded">Actif</span>' : '<span class="bg-red-900 text-red-300 text-xs px-2 py-0.5 rounded">Inactif</span>';

                tr.innerHTML = `
                    <td class="p-3">${statutBadge}</td>
                    <td class="p-3 font-semibold text-white">${vol.depart} ➔ ${vol.arrivee}</td>
                    <td class="p-3 text-xs">Aller: ${vol.date_aller}<br>${vol.date_retour ? 'Ret: ' + vol.date_retour : ''}</td>
                    <td class="p-3 text-xs text-slate-400">
                        ${vol.compagnie ? 'Cible : ' + vol.compagnie : 'Recherche globale'}<br>
                        <span class="text-blue-400 font-medium">Trouvé : ${vol.vendeur || 'Aucun'}</span><br>
                        Escales: ${vol.escales || '0'}
                    </td>        
                    <td class="p-3 font-bold text-emerald-400">${vol.prix_actuel ? vol.prix_actuel + ' €' : '-'}${lienHtml}</td>
                    <td class="p-3 text-xs">Min: ${vol.prix_min ? vol.prix_min + ' €' : '-'}<br>Préc: ${vol.prix_precedent ? vol.prix_precedent + ' €' : '-'}</td>
                    <td class="p-3 text-xs text-slate-400">${vol.derniere_verification || 'Jamais'}</td>
                    <td class="p-3 text-right space-x-2">
                        <button onclick="editerVol('${vol.id}')" class="text-amber-400 hover:text-amber-300 text-xs">Éditer</button>
                        <button onclick="supprimerVol('${vol.id}')" class="text-red-400 hover:text-red-300 text-xs">Supprimer</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function enregistrerVol(event) {
            event.preventDefault();
            const editId = document.getElementById("editId").value; // UUID ou "-1"
            
            const payload = {
                statut: document.getElementById("statut").value,
                depart: document.getElementById("depart").value.toUpperCase(),
                arrivee: document.getElementById("arrivee").value.toUpperCase(),
                date_aller: document.getElementById("dateAller").value,
                date_retour: document.getElementById("dateRetour").value || null,
                compagnie: document.getElementById("compagnie").value || null,
                escales: document.getElementById("escales").value || "0"
            };

            let error;
            if (editId === "-1") {
                const res = await _supabase.from('vols').insert([payload]);
                error = res.error;
            } else {
                const res = await _supabase.from('vols').update(payload).eq('id', editId);
                error = res.error;
            }

            if (error) {
                console.error("Erreur d'enregistrement Supabase:", error);
                alert("Erreur lors de l'enregistrement.");
                return;
            }

            await chargerVolsDepuisSupabase();
            resetForm();
        }

        function editerVol(id) {
            const vol = vols.find(v => v.id === id);
            if (!vol) return;

            document.getElementById("editId").value = vol.id;
            document.getElementById("statut").value = vol.statut;
            document.getElementById("depart").value = vol.depart;
            document.getElementById("arrivee").value = vol.arrivee;
            document.getElementById("dateAller").value = vol.date_aller;
            document.getElementById("dateRetour").value = vol.date_retour || "";
            document.getElementById("compagnie").value = vol.compagnie || "";
            document.getElementById("escales").value = vol.escales || "0";
            
            document.getElementById("formTitle").textContent = "Modifier le vol";
            document.getElementById("btnSubmit").textContent = "Mettre à jour";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function supprimerVol(id) {
            if (confirm("Voulez-vous vraiment supprimer ce vol de la base de données ?")) {
                const { error } = await _supabase.from('vols').delete().eq('id', id);
                if (error) {
                    console.error("Erreur suppression:", error);
                    alert("Impossible de supprimer le vol.");
                    return;
                }
                await chargerVolsDepuisSupabase();
            }
        }

        function resetForm() {
            document.getElementById("volForm").reset();
            document.getElementById("editId").value = "-1";
            document.getElementById("formTitle").textContent = "Ajouter un nouveau vol à suivre";
            document.getElementById("btnSubmit").textContent = "Ajouter";
        }

        async function lancerScanAPI() {
            const url = document.getElementById("scriptUrl").value.trim();
            if (!url) {
                alert("Veuillez renseigner l'URL de votre application web Google Apps Script (/exec).");
                return;
            }

            if (vols.length === 0) {
                alert("Aucun vol configuré à scanner.");
                return;
            }

            const btn = document.getElementById("btnScan");
            btn.disabled = true;
            btn.textContent = "Scan Skyscanner en cours...";

            try {
                const response = await fetch(url, {
                    method: "POST",
                    body: JSON.stringify({ vols: vols })
                });

                const result = await response.json();
                if (result.status === "success") {
					// Mettre à jour chaque vol dans Supabase avec les résultats renvoyés par GAS
					for (let volMaj of result.data) {
						const { error } = await _supabase.from('vols').update({
							prix_actuel: volMaj.prix_actuel,
							prix_precedent: volMaj.prix_precedent,
							prix_min: volMaj.prix_min,
							vendeur: volMaj.vendeur,
							derniere_verification: volMaj.derniere_verification,
							lien: volMaj.lien
						}).eq('id', volMaj.id);

						if (error) {
							console.error(`Erreur Supabase pour le vol ${volMaj.id}:`, error);
							alert(`Erreur de mise à jour Supabase : ${error.message}`);
							return;
						}
					}

					await chargerVolsDepuisSupabase();
					alert("Scan et mise à jour des prix réussis !");
				}
                } else {
                    alert("Erreur du script : " + result.message);
                }
            } catch (error) {
                console.error(error);
                alert("Erreur de communication avec Google Apps Script.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Lancer le scan API";
            }
        }
    </script>
</body>
</html>
